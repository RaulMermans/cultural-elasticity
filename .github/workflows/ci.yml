# Offline verification only. Never add provider or deploy secrets.
# If GitHub Actions is unpaid/unavailable, run the same checks locally:
#   pnpm lint && pnpm typecheck && pnpm test && pnpm eval:methodology &&
#   pnpm eval:live && pnpm eval:elasticity && pnpm eval:agent && pnpm eval:d2d && pnpm eval:discovery && pnpm eval:query &&
#   pnpm build && pnpm check:secrets && pnpm test:e2e && pnpm smoke:docker
# Release stays blocked until this evidence exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # CI never has a provider credential. Live validation is a separate, local, explicitly reported step.
      QLOO_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:methodology
      - run: pnpm eval:live
      - run: pnpm eval:elasticity
      - run: pnpm eval:agent
      - name: Discovery-to-decision eval (synthetic world + recorded live artefacts; no provider call)
        run: pnpm eval:d2d
      - name: Discovery eval (recorded real Qloo pools + Loewe scan, synthetic mechanics; no provider call)
        run: pnpm eval:discovery
      - run: pnpm eval:query
      - run: pnpm build
      - name: Deployment configuration regression guard (offline; no cloud credentials)
        run: pnpm check:deployment-config
      - name: Secret leakage check (repo + browser bundle)
        run: pnpm check:secrets

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      QLOO_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect frontend-relevant changes
        id: filter
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -E '^(frontend/|packages/shared/|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.run == 'true'
      - name: Install Playwright Chromium
        if: steps.filter.outputs.run == 'true'
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Browser E2E (synthetic job API; no provider calls)
        if: steps.filter.outputs.run == 'true'
        run: pnpm test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      QLOO_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect backend-relevant changes
        id: filter
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -E '^(backend/|packages/shared/|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json|railway.json)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker smoke (no provider network)
        if: steps.filter.outputs.run == 'true'
        run: bash scripts/smoke-docker.sh
