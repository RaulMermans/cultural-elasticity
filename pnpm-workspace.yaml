packages:
  - frontend
  - backend
  - packages/*
  - apps/*

# pnpm 10 blocks dependency lifecycle scripts by default. Allow only what the toolchain needs.
onlyBuiltDependencies:
  - esbuild
  - "@swc/core"
  - cbor-extract
# Transitive deps of @qloo/qloo-harness's model runtime; not needed for `qloo exec`.
ignoredBuiltDependencies:
  - "@google/genai"
  - protobufjs
